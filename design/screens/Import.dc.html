<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>CSV-Import mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
a{color:#8EA8FF;text-decoration:none}a:hover{color:#B4C5FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E1014; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; box-sizing: border-box;">

  <header style="display: flex; align-items: center; gap: 12px; padding: 20px 16px 0 16px;">
    <a href="Main.dc.html" aria-label="Import abbrechen" style="width: 44px; height: 44px; border-radius: 14px; background: #171A21; border: 1px solid #2A2F3A; color: #F2F3F5; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; color: #A0A7B4;">Schritt 2 von 3 · Prüfen</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">Abos aus Kontoauszug</h1>
    </div>
  </header>

  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 16px 20px 0 20px;">
    <span style="height: 4px; border-radius: 99px; background: #8EA8FF;"></span>
    <span style="height: 4px; border-radius: 99px; background: #8EA8FF;"></span>
    <span style="height: 4px; border-radius: 99px; background: #2A2F3A;"></span>
  </div>

  <section style="margin: 16px 20px 0 20px; padding: 12px 14px; border-radius: 16px; background: #171A21; border: 1px solid #22262F; display: flex; align-items: center; gap: 12px;">
    <span style="flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; background: #1A2033; color: #8EA8FF; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M8 13h8"></path><path d="M8 17h5"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px; min-width: 0;">
      <span style="font-size: 14px; font-weight: 600;">umsaetze_aug-okt.csv</span>
      <span style="font-size: 12px; color: #A0A7B4;">3 Monate ausgewertet</span>
    </span>
    <a href="#" style="font-size: 13px; font-weight: 500;">Ändern</a>
  </section>

  <p style="margin: 18px 20px 8px 20px; font-size: 14px; line-height: 1.45; color: #A0A7B4;"><strong style="color: #F2F3F5; font-weight: 600;">6 wiederkehrende Zahlungen</strong> gefunden. Wähle aus, was du übernehmen möchtest.</p>

  <ul style="list-style: none; margin: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <li>
        <button role="checkbox" aria-checked="{{it.on}}" aria-disabled="{{it.dup}}" onClick="{{it.toggle}}" style="{{it.rowStyle}}">
          <span style="{{it.boxStyle}}">
            <sc-if value="{{it.on}}" hint-placeholder-val="{{true}}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E1014" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
            </sc-if>
          </span>
          <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 3px; min-width: 0; text-align: left;">
            <span style="font-size: 15px; font-weight: 600; color: #F2F3F5;">{{it.name}}</span>
            <span style="{{it.tagStyle}}">{{it.tag}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px;">
            <span style="font-size: 15px; font-weight: 600; color: #F2F3F5; font-variant-numeric: tabular-nums;">{{it.amount}}</span>
            <span style="font-size: 12px; color: #A0A7B4;">{{it.rhythm}}</span>
          </span>
        </button>
      </li>
    </sc-for>
  </ul>

  <footer style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px 20px; background: #12151B; border-top: 1px solid #22262F; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; font-size: 13px;">
      <span style="color: #A0A7B4;">Neue Fixkosten</span>
      <span style="font-weight: 600; font-variant-numeric: tabular-nums;">+ {{sum}} / Monat</span>
    </div>
    <button style="height: 52px; border-radius: 16px; border: 0; background: #8EA8FF; color: #0E1014; font-size: 15px; font-weight: 600; cursor: pointer;">{{cta}}</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: { spotify: true, disney: true, hausrat: true, rundfunk: false, prime: false } };
  }
  renderVals() {
    var self = this;
    function fmt(n) { return n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
    var list = [
      { id: 'spotify', name: 'Spotify', v: 16.99, m: 16.99, rhythm: 'monatlich', tag: '3× gefunden · Streaming', kind: 'ok' },
      { id: 'disney', name: 'Disney+', v: 9.99, m: 9.99, rhythm: 'monatlich', tag: '3× gefunden · Streaming', kind: 'ok' },
      { id: 'hausrat', name: 'Hausratversicherung', v: 89.40, m: 7.45, rhythm: 'jährlich', tag: 'Rhythmus prüfen · 1× gefunden', kind: 'warn' },
      { id: 'rundfunk', name: 'Rundfunkbeitrag', v: 55.08, m: 18.36, rhythm: 'vierteljährlich', tag: 'Abgaben · 1× gefunden', kind: 'ok' },
      { id: 'prime', name: 'Amazon Prime', v: 8.99, m: 8.99, rhythm: 'monatlich', tag: '3× gefunden · Shopping', kind: 'ok' },
      { id: 'handy', name: 'Handyvertrag', v: 19.99, m: 19.99, rhythm: 'monatlich', tag: 'Bereits angelegt', kind: 'dup' }
    ];
    var sel = this.state.sel;
    var sum = 0, count = 0;
    var items = list.map(function (x) {
      var dup = x.kind === 'dup';
      var on = !dup && !!sel[x.id];
      if (on) { sum += x.m; count += 1; }
      var row = 'width: 100%; min-height: 64px; box-sizing: border-box; padding: 10px 14px; border-radius: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-family: inherit; ';
      row += on ? 'background: #171D2E; border: 1px solid #3A4878;' : 'background: #171A21; border: 1px solid #22262F;';
      if (dup) row += ' opacity: 0.6; cursor: default;';
      var box = 'flex: 0 0 auto; width: 24px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ';
      box += on ? 'background: #8EA8FF; border: 0;' : 'background: transparent; border: 2px solid #4A5161;';
      var tagColor = x.kind === 'warn' ? '#FFB25C' : '#A0A7B4';
      return {
        name: x.name, rhythm: x.rhythm, tag: x.tag, amount: fmt(x.v), on: on, dup: dup,
        rowStyle: row, boxStyle: box,
        tagStyle: 'font-size: 12px; color: ' + tagColor + ';',
        toggle: function () {
          if (dup) return;
          var next = Object.assign({}, self.state.sel);
          next[x.id] = !next[x.id];
          self.setState({ sel: next });
        }
      };
    });
    return {
      items: items,
      sum: fmt(sum),
      cta: count === 1 ? '1 Abo übernehmen' : count + ' Abos übernehmen'
    };
  }
}
</script>
</body>
</html>
