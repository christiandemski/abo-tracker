name: Deploy

# Started manually: GitHub → Actions → Deploy → "Run workflow".
# Builds API + web app on GitHub's runner, uploads via rsync over SSH, then migrates.
# Required secrets: see docs/DEPLOY.md.

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql, zip, fileinfo, sodium
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install API dependencies (production)
        working-directory: api
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Build web app into api/public/app
        working-directory: app
        run: |
          npm ci
          npm run export:web

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT || 22 }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF

      - name: Upload (rsync)
        # .env, storage contents and the SQLite file stay on the server.
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/app/***' \
            --exclude='storage/logs/***' \
            --exclude='storage/framework/cache/***' \
            --exclude='storage/framework/sessions/***' \
            --exclude='storage/framework/views/***' \
            --exclude='database/*.sqlite' \
            --exclude='tests/' \
            --exclude='phpunit.xml' \
            --exclude='node_modules/' \
            api/ deploy:"${{ secrets.DEPLOY_PATH }}/"

      - name: Migrate and optimize
        run: |
          ssh deploy "cd '${{ secrets.DEPLOY_PATH }}' \
            && mkdir -p storage/app/public storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache \
            && $PHP_BIN artisan migrate --force \
            && $PHP_BIN artisan db:seed --force \
            && $PHP_BIN artisan optimize"

      - name: Health check
        run: curl --fail --silent --show-error https://kosten.codekorb.de/api/v1/health
